name: Deploy

on:
  push:
    branches: [main]

env:
  AWS_REGION: us-east-1 # must match infra/*/variables.tf and the live backend block

permissions:
  contents: read

concurrency:
  group: terraform-apply
  cancel-in-progress: false

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
      - run: uv sync --locked
      - run: uv run ruff check .
      - run: uv run mypy src
      - run: uv run pytest

  deploy:
    needs: backend
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write # GitHub OIDC -> AWS, no stored access keys
    defaults:
      run:
        working-directory: infra/live
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
        with:
          terraform_version: 1.17.1
          terraform_wrapper: false # plain stdout for $(terraform output -raw ...)
      - uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd # v6.3.0
        with:
          role-to-assume: ${{ vars.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}
      - run: >-
          terraform init -input=false
          -backend-config="bucket=${{ vars.TF_STATE_BUCKET }}"
      # The Lambda needs an image to exist before it can be created, so the
      # ECR repo is applied first, then the image is pushed, then the rest.
      - name: Apply ECR repository
        run: terraform apply -input=false -auto-approve -target=aws_ecr_repository.backend
      - name: Build and push backend image
        working-directory: backend
        env:
          IMAGE_TAG: ${{ github.sha }}
        run: |
          REPO_URL=$(terraform -chdir=../infra/live output -raw backend_ecr_repository_url)
          aws ecr get-login-password | docker login --username AWS --password-stdin "${REPO_URL%%/*}"
          # Re-runs of the same commit: the tag is immutable, so skip the push if it exists.
          if aws ecr describe-images --repository-name "${REPO_URL#*/}" --image-ids imageTag="$IMAGE_TAG" >/dev/null 2>&1; then
            echo "image $IMAGE_TAG already pushed"
          else
            docker build --platform linux/amd64 -t "$REPO_URL:$IMAGE_TAG" .
            docker push "$REPO_URL:$IMAGE_TAG"
          fi
      - name: Apply infrastructure
        run: terraform apply -input=false -auto-approve -var="backend_image_tag=${{ github.sha }}"
      - name: Roll out backend image
        env:
          IMAGE_TAG: ${{ github.sha }}
        run: |
          FUNCTION=$(terraform output -raw chat_lambda_function_name)
          REPO_URL=$(terraform output -raw backend_ecr_repository_url)
          aws lambda update-function-code --function-name "$FUNCTION" --image-uri "$REPO_URL:$IMAGE_TAG" >/dev/null
          aws lambda wait function-updated-v2 --function-name "$FUNCTION"
