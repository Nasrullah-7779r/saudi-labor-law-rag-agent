name: Ingest

# Manual: re-run when the BOE publishes an amended Labor Law.
on:
  workflow_dispatch:
    inputs:
      version:
        description: "Law version date (ISO, Gregorian) of the latest amendment in force, e.g. 2025-02-19"
        required: true
        type: string

env:
  AWS_REGION: us-east-1 # must match infra/*/variables.tf
  BOE_LABOR_LAW_URL: https://laws.boe.gov.sa/BoeLaws/Laws/LawDetails/08381293-6388-48e2-8ad2-a9a700f2aa94/1

permissions:
  contents: read

concurrency:
  group: ingest
  cancel-in-progress: false

jobs:
  ingest:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write # GitHub OIDC -> AWS, no stored access keys
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
      - run: uv sync --locked --no-dev
      - uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd # v6.3.0
        with:
          role-to-assume: ${{ vars.AWS_INGEST_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}
      # The law text is fetched at run time, never committed.
      - name: Fetch BOE page
        run: curl --fail --silent --show-error --max-time 60 -o "$RUNNER_TEMP/boe_labor_law.html" "$BOE_LABOR_LAW_URL"
      - name: Parse, embed and upsert
        env:
          PINECONE_INDEX_NAME: ${{ vars.PINECONE_INDEX_NAME }}
          PINECONE_API_KEY_SECRET_ID: saudi-labor-law-rag-agent/pinecone-api-key
          LAW_VERSION: ${{ inputs.version }}
        run: >-
          uv run python -m labor_law_agent.ingest
          --html-file "$RUNNER_TEMP/boe_labor_law.html"
          --version "$LAW_VERSION"
          --source-url "$BOE_LABOR_LAW_URL"
