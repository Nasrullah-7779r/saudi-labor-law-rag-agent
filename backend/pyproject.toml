[project]
name = "labor-law-agent"
version = "0.1.0"
description = "Bilingual Saudi Labor Law RAG agent (backend)"
requires-python = ">=3.12"
dependencies = [
    "beautifulsoup4>=4.12",
    "boto3>=1.35",
    "fastapi>=0.162.4",
    "hijridate>=2.6,<3",
    "pinecone>=7.3,<8",
    "pydantic>=2.7",
    "uvicorn>=0.54.0",
]

[dependency-groups]
dev = [
    "pytest>=8",
    "ruff>=0.6",
    "mypy>=1.11",
    "httpx>=0.28.1",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/labor_law_agent"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100

[tool.mypy]
strict = true
ignore_missing_imports = true
