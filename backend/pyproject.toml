[project]
name = "labor-law-agent"
version = "0.1.0"
description = "Bilingual Saudi Labor Law RAG agent (backend)"
requires-python = ">=3.12"
dependencies = [
    "beautifulsoup4>=4.12",
    "pydantic>=2.7",
]

[dependency-groups]
dev = ["pytest>=8", "ruff>=0.6", "mypy>=1.11"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/labor_law_agent"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100

[tool.mypy]
strict = true
ignore_missing_imports = true
